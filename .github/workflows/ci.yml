name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: 类型检查（主进程 + 渲染进程）
        run: npm run typecheck

      - name: 单元测试
        shell: bash
        run: |
          npx vitest run --reporter=verbose > /tmp/vitest.log 2>&1 && passed=1 || passed=0
          tail -40 /tmp/vitest.log
          # 步骤日志要登录才能下载，注解匿名可读：失败时把尾部日志揉成注解方便排障
          if [ "$passed" = 0 ]; then
            tail -60 /tmp/vitest.log | node .github/ci-annotate.mjs
          fi
          [ "$passed" = 1 ]

      - name: 构建网页端产物
        run: npm run build:web

      - name: 构建桌面端产物
        run: npm run build
